apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rinco.fullname" . }}-auth
  labels:
    {{- include "rinco.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.services.auth.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rinco.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth-service
  template:
    metadata:
      labels:
        {{- include "rinco.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: auth-service
    spec:
      containers:
        - name: auth-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.auth.image | default "rinco/auth-service" }}:{{ .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.auth.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.services.auth.port }}"
            - name: DB_HOST
              value: "{{ include "rinco.postgresql.host" . }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rinco.fullname" . }}-secrets
                  key: db-password
            - name: PASETO_KEY_CURRENT
              valueFrom:
                secretKeyRef:
                  name: {{ include "rinco.fullname" . }}-secrets
                  key: paseto-key
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rinco.fullname" . }}-auth
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "rinco.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
