apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rinco.fullname" . }}-secrets
  labels:
    {{- include "rinco.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-user: {{ .Values.services.tenant.DB_USER | default "rinco_app" }}
  db-password: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | b64enc | quote }}
  paseto-current: {{ required "secrets.pasetoCurrent is required" .Values.secrets.pasetoCurrent | b64enc | quote }}
  paseto-previous: {{ .Values.secrets.pasetoPrevious | default "" | b64enc | quote }}
  jwt-signing: {{ .Values.secrets.jwtSigning | default "" | b64enc | quote }}
  minio-secret-key: {{ .Values.secrets.minioRootPassword | default "rinco_dev_password" | b64enc | quote }}
