{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $component := $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rinco.serviceName" (dict "Values" $root.Values "component" $component) }}
  labels:
    {{- include "rinco.labels" $root | nindent 4 }}
    {{- include "rinco.componentLabel" (dict "Values" $root.Values "component" $component) | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ $svc.port }}"
spec:
  type: {{ $root.Values.service.type }}
  ports:
    - name: http
      port: {{ $root.Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "rinco.componentLabel" (dict "Values" $root.Values "component" $component) | nindent 4 }}
{{- end }}
{{- end }}
