version: '3.8'

# ============================================================
# RINCO Local Development Stack
# ============================================================
# Bao gồm:
# 1. 9 Polyglot databases (PostgreSQL, ScyllaDB, ClickHouse, MongoDB, Valkey, MinIO, Qdrant, Meilisearch, NATS)
# 2. Observability stack (Prometheus, Grafana, Loki, Jaeger, Vector, OpenTelemetry Collector)
# 3. Migration tooling (Atlas, clickhouse-migrator, ...)
# 4. Development utilities (MailHog, MinIO console, ...)
# ============================================================

x-common-env: &common-env
  TZ: Asia/Ho_Chi_Minh

services:
  # ============================================================
  # 1. POSTGRESQL 16 (Multi-tenant CRM, Auth, RLS, LTREE)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: rinco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rinco
      POSTGRES_PASSWORD: rinco_dev_password
      POSTGRES_DB: rinco
      <<: *common-env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "log_min_duration_statement=200"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinco -d rinco"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rinco-net

  # PgBouncer - build from source if needed (commented out for now, PostgreSQL handles direct connections)
  # pgbouncer:
  #   image: edob01/pgbouncer:1.22.0
  #   container_name: rinco-pgbouncer
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgresql://rinco:rinco_dev_password@postgres:5432/rinco
  #     POOL_MODE: transaction
  #     MAX_CLIENT_CONN: 1000
  #     DEFAULT_POOL_SIZE: 25
  #   ports:
  #     - "6432:5432"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - rinco-net

  # ============================================================
  # 2. SCYLLADB 6.x (Chat, WebRTC, Leads Raw)
  # ============================================================
  scylla:
    image: scylladb/scylla:6.2.0
    container_name: rinco-scylla
    restart: unless-stopped
    environment:
      SCYLLA_CLUSTER_NAME: rinco-cluster
      SCYLLA_DC: datacenter1
      SCYLLA_RACK: rack1
      SCYLLA_SEEDS: scylla
      SCYLLA_LISTEN_ADDRESS: 0.0.0.0
      SCYLLA_BROADCAST_ADDRESS: scylla
      SCYLLA_MIGRATION_TIMEOUT: 30000
      SCYLLA_AUTO_BOOTSTRAP: "true"
    command:
      - "--developer-mode=1"
      - "--memory=2G"
      - "--smp=2"
      - "--overprovisioned=1"
    ports:
      - "9042:9042"
      - "7000:7000"
      - "7001:7001"
    volumes:
      - scylla_data:/var/lib/scylla
      - scylla_commitlog:/var/lib/scylla/commitlog
      - ./scylla/init.cql:/etc/scylla/init.cql:ro
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe cluster"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - rinco-net

  # ============================================================
  # 3. CLICKHOUSE 24.x (Logs, Audit, Metrics OLAP)
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: rinco-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: rinco_logs
      CLICKHOUSE_USER: rinco
      CLICKHOUSE_PASSWORD: rinco_dev_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      <<: *common-env
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rinco-net

  # ============================================================
  # 4. MONGODB 7.x (Lead Enrichment, Flexible Schema)
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: rinco-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: rinco
      MONGO_INITDB_ROOT_PASSWORD: rinco_dev_password
      MONGO_INITDB_DATABASE: rinco
      <<: *common-env
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rinco-net

  # ============================================================
  # 5. VALKEY 7.x (Cache, Presence, Rate Limit, AI Cache)
  # ============================================================
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: rinco-valkey
    restart: unless-stopped
    command:
      - "valkey-server"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rinco-net

  # ============================================================
  # 6. MINIO (S3-compatible Object Storage)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: rinco-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: rinco
      MINIO_ROOT_PASSWORD: rinco_dev_password
    command:
      - "server"
      - "/data"
      - "--console-address=:9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rinco-net

  # MinIO bucket auto-create
  minio-init:
    image: minio/mc:latest
    container_name: rinco-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 rinco rinco_dev_password;
      mc mb --ignore-existing local/chat-attachments;
      mc mb --ignore-existing local/recordings;
      mc mb --ignore-existing local/landing-assets;
      mc mb --ignore-existing local/model-artifacts;
      mc anonymous set download local/landing-assets;
      echo 'MinIO buckets created';
      "
    networks:
      - rinco-net

  # ============================================================
  # 7. QDRANT (Vector Database cho RAG)
  # ============================================================
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: rinco-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - rinco-net

  # ============================================================
  # 8. MEILISEARCH (Full-text Search tiếng Việt)
  # ============================================================
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: rinco-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: rinco_dev_password
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - rinco-net

  # ============================================================
  # 9. NATS JetStream (Event Streaming)
  # ============================================================
  nats:
    image: nats:2.10-alpine
    container_name: rinco-nats
    restart: unless-stopped
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    volumes:
      - nats_data:/data
    networks:
      - rinco-net

  # ============================================================
  # OBSERVABILITY STACK
  # ============================================================

  # Prometheus metrics
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: rinco-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    networks:
      - rinco-net

  # Grafana dashboards
  grafana:
    image: grafana/grafana:10.4.2
    container_name: rinco-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource,grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - rinco-net

  # Loki for log aggregation
  loki:
    image: grafana/loki:2.9.4
    container_name: rinco-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - rinco-net

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: rinco-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
      - "4318:4318"
    networks:
      - rinco-net

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: rinco-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "1888:1888"   # pprof extension
      - "8888:8888"   # Prometheus metrics
      - "13133:13133" # health_check
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - rinco-net

  # ============================================================
  # DEV UTILITIES
  # ============================================================

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: rinco-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - rinco-net

  # WireGuard for admin VPN (Dark Admin)
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: rinco-wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Ho_Chi_Minh
      SERVERURL: wireguard.rinco.local
      PEERS: admin1,admin2
      PEERDNS: 1.1.1.1
      INTERNAL_SUBNET: 10.13.13.0
    ports:
      - "51820:51820/udp"
    volumes:
      - wireguard_config:/config
      - /lib/modules:/lib/modules
    networks:
      - rinco-net

volumes:
  postgres_data:
  scylla_data:
  scylla_commitlog:
  clickhouse_data:
  mongodb_data:
  mongodb_config:
  valkey_data:
  minio_data:
  qdrant_data:
  meilisearch_data:
  nats_data:
  prometheus_data:
  grafana_data:
  loki_data:
  wireguard_config:

networks:
  rinco-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
