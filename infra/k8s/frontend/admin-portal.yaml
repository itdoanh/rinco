# ============================================================
# admin-portal — Next.js (BFF + Admin UI)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-portal
  namespace: rinco
  labels:
    app: admin-portal
    tier: frontend
    language: typescript
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-portal
  template:
    metadata:
      labels:
        app: admin-portal
        tier: frontend
        language: typescript
    spec:
      serviceAccountName: rinco-default
      containers:
        - name: admin-portal
          image: rinco/admin-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.rinco.vn"
            - name: NEXTAUTH_URL
              value: "https://admin.rinco.vn"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: jwt-secret
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin-portal
  namespace: rinco
spec:
  selector:
    app: admin-portal
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
