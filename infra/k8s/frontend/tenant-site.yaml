# ============================================================
# tenant-site-frontend — Next.js per-tenant sites
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-site
  namespace: rinco
  labels:
    app: tenant-site
    tier: frontend
    language: typescript
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tenant-site
  template:
    metadata:
      labels:
        app: tenant-site
        tier: frontend
        language: typescript
    spec:
      serviceAccountName: rinco-default
      containers:
        - name: tenant-site
          image: rinco/tenant-site:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.rinco.vn"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-site
  namespace: rinco
spec:
  selector:
    app: tenant-site
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
