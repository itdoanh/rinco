# ============================================================
# landing-frontend — Next.js public landing pages
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: rinco
  labels:
    app: landing
    tier: frontend
    language: typescript
spec:
  replicas: 3
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
        tier: frontend
        language: typescript
    spec:
      serviceAccountName: rinco-default
      containers:
        - name: landing
          image: rinco/landing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.rinco.vn"
            - name: LANDING_PUBLIC_URL
              value: "https://landing.rinco.vn"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: rinco
spec:
  selector:
    app: landing
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: landing-hpa
  namespace: rinco
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: landing
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
