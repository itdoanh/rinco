# ============================================================
# meeting-ui — Next.js + WebRTC client
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting-ui
  namespace: rinco
  labels:
    app: meeting-ui
    tier: frontend
    language: typescript
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meeting-ui
  template:
    metadata:
      labels:
        app: meeting-ui
        tier: frontend
        language: typescript
    spec:
      serviceAccountName: rinco-default
      containers:
        - name: meeting-ui
          image: rinco/meeting-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.rinco.vn"
            - name: NEXT_PUBLIC_SIGNALING_URL
              value: "wss://meeting.rinco.vn"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: meeting-ui
  namespace: rinco
spec:
  selector:
    app: meeting-ui
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
