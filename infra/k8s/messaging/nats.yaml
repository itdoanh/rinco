# ============================================================
# NATS JetStream — event bus
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  namespace: messaging
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: messaging
  labels:
    app: nats
    tier: messaging
spec:
  serviceName: nats
  replicas: 3
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
        tier: messaging
    spec:
      containers:
        - name: nats
          image: nats:2.10.17-alpine
          args:
            - --cluster_name=rinco
            - --cluster
            - nats-0.nats-headless.messaging.svc.cluster.local:6222
            - --store_dir=/data
            - --jetstream
            - --http_port=8222
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 6222
              name: cluster
            - containerPort: 8222
              name: monitor
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: messaging
spec:
  selector:
    app: nats
  ports:
    - port: 4222
      targetPort: 4222
      name: client
    - port: 8222
      targetPort: 8222
      name: monitor
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  namespace: messaging
spec:
  selector:
    app: nats
  ports:
    - port: 4222
      name: client
    - port: 6222
      name: cluster
  clusterIP: None
