# ============================================================
# ai-sre — Python, DeepSeek-Coder RCA + alerting
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sre
  namespace: rinco
  labels:
    app: ai-sre
    tier: ai
    language: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-sre
  template:
    metadata:
      labels:
        app: ai-sre
        tier: ai
        language: python
    spec:
      serviceAccountName: rinco-default
      containers:
        - name: ai-sre
          image: rinco/ai-sre:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8099
              name: http
            - containerPort: 9108
              name: metrics
          env:
            - name: AI_SRE_HTTP_ADDR
              value: ":8099"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: postgres-host
            - name: CLICKHOUSE_URL
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: clickhouse-host
            - name: VALKEY_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: valkey-host
            - name: NATS_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: nats-host
            - name: LLM_MODEL
              value: deepseek-coder-v2-lite-instruct
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: github-token
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: telegram-bot-token
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: "rinco-ai-sre"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /health
              port: 8099
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-sre
  namespace: rinco
spec:
  selector:
    app: ai-sre
  ports:
    - port: 8099
      targetPort: 8099
      name: http
  type: ClusterIP
