# ============================================================
# billing-service — Go, Stripe + VNPay
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: rinco
  labels:
    app: billing-service
    tier: core
    language: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
        tier: core
        language: go
    spec:
      serviceAccountName: rinco-default
      containers:
        - name: billing-service
          image: rinco/billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8094
              name: http
            - containerPort: 9103
              name: metrics
          env:
            - name: BILLING_HTTP_ADDR
              value: ":8094"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: postgres-host
            - name: DB_NAME
              value: rinco
            - name: DB_USER
              value: rinco
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
                  optional: true
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: stripe-secret-key
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: billing-secrets
                  key: stripe-webhook-secret
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: "rinco-billing-service"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8094
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: rinco
spec:
  selector:
    app: billing-service
  ports:
    - port: 8094
      targetPort: 8094
      name: http
  type: ClusterIP
