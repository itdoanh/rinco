# ============================================================
# meta-capi-service — Go, Facebook Conversions API
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meta-capi-service
  namespace: rinco
  labels:
    app: meta-capi-service
    tier: edge
    language: go
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meta-capi-service
  template:
    metadata:
      labels:
        app: meta-capi-service
        tier: edge
        language: go
    spec:
      serviceAccountName: rinco-default
      containers:
        - name: meta-capi-service
          image: rinco/meta-capi-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
            - containerPort: 9094
              name: metrics
          env:
            - name: META_CAPI_HTTP_ADDR
              value: ":8084"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: postgres-host
            - name: SCYLLA_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: scylla-host
            - name: NATS_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: nats-host
            - name: META_APP_ID
              valueFrom:
                secretKeyRef:
                  name: meta-capi-secrets
                  key: app-id
                  optional: true
            - name: META_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: meta-capi-secrets
                  key: app-secret
                  optional: true
            - name: META_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: meta-capi-secrets
                  key: hmac-secret
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: "rinco-meta-capi-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: otel-exporter-otlp-endpoint
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: meta-capi-service
  namespace: rinco
spec:
  selector:
    app: meta-capi-service
  ports:
    - port: 8084
      targetPort: 8084
      name: http
  type: ClusterIP
