# ============================================================
# tenant-service — Go, tenant CRUD, domain routing
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
  namespace: rinco
  labels:
    app: tenant-service
    tier: core
    language: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tenant-service
  template:
    metadata:
      labels:
        app: tenant-service
        tier: core
        language: go
    spec:
      serviceAccountName: rinco-default
      containers:
        - name: tenant-service
          image: rinco/tenant-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
            - containerPort: 9092
              name: metrics
          env:
            - name: TENANT_HTTP_ADDR
              value: ":8082"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: postgres-host
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: rinco
            - name: DB_USER
              value: rinco
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
                  optional: true
            - name: VALKEY_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: valkey-host
            - name: NATS_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: nats-host
            - name: OTEL_SERVICE_NAME
              value: "rinco-tenant-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: otel-exporter-otlp-endpoint
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-service
  namespace: rinco
spec:
  selector:
    app: tenant-service
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  type: ClusterIP
