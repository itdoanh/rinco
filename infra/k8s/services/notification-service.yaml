# ============================================================
# notification-service — Go, Push / SMS / Telegram / FB Messenger
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: rinco
  labels:
    app: notification-service
    tier: edge
    language: go
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        tier: edge
        language: go
    spec:
      serviceAccountName: rinco-default
      containers:
        - name: notification-service
          image: rinco/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
              name: http
            - containerPort: 9100
              name: metrics
          env:
            - name: NOTIFICATION_HTTP_ADDR
              value: ":8091"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: postgres-host
            - name: DB_NAME
              value: rinco
            - name: DB_USER
              value: rinco
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
                  optional: true
            - name: NATS_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: nats-host
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: telegram-bot-token
                  optional: true
            - name: FIREBASE_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: firebase-key
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: "rinco-notification-service"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: rinco
spec:
  selector:
    app: notification-service
  ports:
    - port: 8091
      targetPort: 8091
      name: http
  type: ClusterIP
