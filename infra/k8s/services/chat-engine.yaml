# ============================================================
# chat-engine — Rust, WebSocket + FlatBuffers + ScyllaDB
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-engine
  namespace: rinco
  labels:
    app: chat-engine
    tier: realtime
    language: rust
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chat-engine
  template:
    metadata:
      labels:
        app: chat-engine
        tier: realtime
        language: rust
    spec:
      serviceAccountName: rinco-default
      containers:
        - name: chat-engine
          image: rinco/chat-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
              name: http
            - containerPort: 8087
              name: ws
            - containerPort: 9096
              name: metrics
          env:
            - name: SCYLLA_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: scylla-host
            - name: SCYLLA_PORT
              value: "9042"
            - name: VALKEY_URL
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: valkey-host
            - name: NATS_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: nats-host
            - name: RUST_LOG
              value: info
            - name: OTEL_SERVICE_NAME
              value: "rinco-chat-engine"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: otel-exporter-otlp-endpoint
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chat-engine
  namespace: rinco
spec:
  selector:
    app: chat-engine
  ports:
    - port: 8086
      targetPort: 8086
      name: http
    - port: 8087
      targetPort: 8087
      name: ws
  type: ClusterIP
