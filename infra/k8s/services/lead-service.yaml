# ============================================================
# lead-service — Go, Lead CRUD, scoring hooks
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-service
  namespace: rinco
  labels:
    app: lead-service
    tier: core
    language: go
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lead-service
  template:
    metadata:
      labels:
        app: lead-service
        tier: core
        language: go
    spec:
      serviceAccountName: rinco-default
      containers:
        - name: lead-service
          image: rinco/lead-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
            - containerPort: 9095
              name: metrics
          env:
            - name: LEAD_HTTP_ADDR
              value: ":8085"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: postgres-host
            - name: DB_NAME
              value: rinco
            - name: DB_USER
              value: rinco
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
                  optional: true
            - name: MONGODB_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: mongodb-host
            - name: MONGODB_USER
              value: rinco
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: password
                  optional: true
            - name: VALKEY_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: valkey-host
            - name: NATS_HOST
              valueFrom:
                configMapKeyRef:
                  name: rinco-config
                  key: nats-host
            - name: OTEL_SERVICE_NAME
              value: "rinco-lead-service"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lead-service
  namespace: rinco
spec:
  selector:
    app: lead-service
  ports:
    - port: 8085
      targetPort: 8085
      name: http
  type: ClusterIP
