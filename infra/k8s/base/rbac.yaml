# ============================================================
# ServiceAccount, ClusterRole & RABC for RINCO services
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rinco-default
  namespace: rinco
imagePullSecrets:
  - name: regcred
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rinco-admin
  namespace: rinco
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rinco-leader
  namespace: rinco
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "services", "endpoints", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rinco-default-binding
  namespace: rinco
subjects:
  - kind: ServiceAccount
    name: rinco-default
    namespace: rinco
roleRef:
  kind: Role
  name: rinco-leader
  apiGroup: rbac.authorization.k8s.io
