# ============================================================
# HPA + PDB + PDB for stateful service classes
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-services-hpa
  namespace: rinco
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-services
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-services-pdb
  namespace: rinco
spec:
  minAvailable: 2
  selector:
    matchLabels:
      tier: api
