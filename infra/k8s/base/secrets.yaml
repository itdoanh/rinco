apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: rinco
  labels:
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # 32-byte PASETO symmetric key (replace in production)
  paseto-key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  jwt-secret: "change-me-jwt-secret-32-bytes-long-padding-here"
  fido2-rp-id: "auth.rinco.local"
  fido2-rp-origin: "https://admin.rinco.local"
---
