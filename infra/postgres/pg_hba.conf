# ============================================================
# PostgreSQL pg_hba.conf — Authentication Rules (RINCO)
# ============================================================
# Reference: https://www.postgresql.org/docs/16/auth-pg-hba-conf.html
# ============================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# --- local Unix socket (admin / maintenance) ---
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# --- IPv4 / IPv6 loopback ---
host    all             postgres        127.0.0.1/32            scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# --- Internal Docker network (172.25.0.0/16) — trust app pool ---
host    rinco           rinco           172.25.0.0/16           scram-sha-256
host    rinco           rinco_app       172.25.0.0/16           scram-sha-256

# --- Replication (slots used by replicas) ---
host    replication     replicator      172.25.0.0/16           scram-sha-256

# --- External admin (block by default) ---
host    all             all             0.0.0.0/0               reject
