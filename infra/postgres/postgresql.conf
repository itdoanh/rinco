# ============================================================
# PostgreSQL 16 main configuration — RINCO tuned for 16GB RAM
# ============================================================

# ---- Connection ----
listen_addresses = '*'
max_connections  = 200
superuser_reserved_connections = 5

# ---- Memory (assume 16GB host) ----
shared_buffers          = 4GB
work_mem                = 64MB
maintenance_work_mem    = 1GB
effective_cache_size    = 12GB
huge_pages              = try

# ---- WAL ----
wal_level               = replica
max_wal_senders         = 10
max_replication_slots   = 10
wal_compression         = zstd
synchronous_commit      = on
wal_buffers             = 16MB
checkpoint_completion_target = 0.9
max_wal_size            = 4GB
min_wal_size            = 1GB

# ---- Query planner ----
random_page_cost        = 1.1
effective_io_concurrency = 200

# ---- Parallelism ----
max_worker_processes        = 8
max_parallel_workers        = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ---- Logging ----
logging_collector      = on
log_destination        = 'stderr'
log_min_duration_statement = 500ms
log_lock_waits         = on
log_temp_files         = 0
log_checkpoints        = on
log_connections        = on
log_disconnections     = on
log_line_prefix        = '%t [%p]: db=%d,user=%u,app=%a '
log_timezone           = 'Asia/Ho_Chi_Minh'

# ---- Autovacuum ----
autovacuum             = on
autovacuum_max_workers = 4
autovacuum_naptime     = 30s

# ---- Statistics / extensions ----
shared_preload_libraries = 'pg_stat_statements,pg_cron,vector'
track_io_timing         = on
track_activities        = on
track_counts            = on
track_functions         = pl
default_statistics_target = 500

# ---- Locale ----
timezone                = 'Asia/Ho_Chi_Minh'
lc_messages             = 'en_US.utf8'
lc_monetary             = 'en_US.utf8'
lc_numeric              = 'en_US.utf8'
lc_time                 = 'en_US.utf8'

# ---- Cron ----
cron.database_name = 'rinco'
