apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-static-config
data:
  traefik.yml: |
    global:
      checkNewVersion: false
    api:
      dashboard: true
      insecure: true
    entryPoints:
      web:
        address: ":80"
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        address: ":443"
      traefik:
        address: ":8080"
    providers:
      kubernetesIngress:
        enabled: true
      kubernetesCRD:
        enabled: true
    log:
      level: INFO
    metrics:
      prometheus: {}
    ping:
      entryPoint: traefik
