apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      tlsSkipVerify: true
      timeInterval: 30s
      manageAlerts: true
      prometheusType: Prometheus
      cacheLevel: High
      incrementalQuerying: true
      queryTimeout: 60s
      httpMethod: POST
