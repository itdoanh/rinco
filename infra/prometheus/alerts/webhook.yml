# ============================================================
# AlertManager — RINCO
# Routes alerts to Slack / PagerDuty based on severity.
# ============================================================
global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@rinco.app'
  smtp_auth_username: 'alerts@rinco.app'
  smtp_auth_password: '${SMTP_ALERT_PASSWORD}'
  smtp_require_tls: true
  slack_api_url: '${SLACK_WEBHOOK_URL}'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'rinco-default'
  routes:
    # P0 — page immediately
    - match:
        severity: P0
      receiver: 'rinco-pagerduty'
      group_wait: 10s
      repeat_interval: 30m
      continue: false

    # P1 — Slack alert
    - match:
        severity: P1
      receiver: 'rinco-slack'
      group_wait: 30s
      repeat_interval: 2h
      continue: true

    # P2 — Slack digest (only business hours)
    - match:
        severity: P2
      receiver: 'rinco-slack-low'
      group_wait: 5m
      repeat_interval: 12h
      continue: true

    # Database-specific PagerDuty
    - match:
        team: dba
      receiver: 'rinco-dba-pagerduty'

# ============================================================
# Receivers
# ============================================================
receivers:
  - name: 'rinco-default'
    slack_configs:
      - channel: '#rinco-alerts'
        send_resolved: true
        title: '{{ .CommonLabels.alertname | upper }} ({{ .CommonLabels.severity }})'
        text: |
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          {{ range .Alerts }}
            • `{{ .Labels.service }}` {{ if .Labels.instance }}@ {{ .Labels.instance }}{{ end }}
          {{ end }}

  - name: 'rinco-slack'
    slack_configs:
      - channel: '#rinco-incidents'
        send_resolved: true
        title: '[P1] {{ .CommonLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }}'
        mention_users:
          - 'rinco-oncall'

  - name: 'rinco-slack-low'
    slack_configs:
      - channel: '#rinco-ops'
        send_resolved: false

  - name: 'rinco-pagerduty'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        severity: 'critical'
        description: '{{ .CommonAnnotations.summary }}'

  - name: 'rinco-dba-pagerduty'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_DBA_KEY}'
        severity: 'critical'

# ============================================================
# Inhibit: suppress lower-severity alerts when higher is firing
# ============================================================
inhibit_rules:
  - source_match:
      severity: 'P0'
    target_match:
      severity: 'P1'
    equal: ['alertname', 'cluster', 'service']

  - source_match:
      severity: 'P0'
    target_match:
      severity: 'P2'
    equal: ['alertname', 'cluster', 'service']
