# ============================================================
# RINCO WS-E — Warning (P1) alert rules
# ============================================================
# P1 alerts Slack #ops-alerts but do not page.  They are
# early-warning signals: a slow trend, a near-saturation
# resource, a recurring degradation that will become P0 if
# ignored for 30+ minutes.

groups:

# ============================================================
# 1. High error rate / partial outage
# ============================================================
- name: rinco.api.errors.warning
  interval: 30s
  rules:
  - alert: HighErrorRate
    expr: |
      (
        sum(rate(rinco_http_requests_total{status=~"5.."}[5m])) by (service, route)
        /
        sum(rate(rinco_http_requests_total[5m])) by (service, route)
      ) > 0.01
    for: 2m
    labels:
      severity: P1
      team: sre
      page: "false"
    annotations:
      summary: "Error rate > 1% on {{ $labels.service }}{{ $labels.route }}"
      runbook: "https://wiki.rinco.app/runbooks/http-errors"

  - alert: LatencyP99High
    expr: |
      histogram_quantile(
        0.99,
        sum(rate(rinco_http_request_duration_seconds_bucket[5m])) by (service, route, le)
      ) > 0.5
    for: 5m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "p99 > 500ms on {{ $labels.service }}{{ $labels.route }}"

  - alert: ChatBacklogHigh
    expr: rinco_nats_pending_messages > 50000
    for: 5m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "NATS pending messages > 50k (stream {{ $labels.stream }})"

  - alert: EventDeliveryLag
    expr: |
      rinco_event_dispatch_lag_seconds > 30
    for: 5m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "Event dispatch lag > 30s for {{ $labels.event }}"

  - alert: CircuitBreakerOpen
    expr: rinco_circuit_breaker_state == 2
    for: 0m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "Circuit breaker OPEN for {{ $labels.name }}"

# ============================================================
# 2. Latency budget near exhaustion
# ============================================================
- name: rinco.latency.warning
  interval: 30s
  rules:
  - alert: P95LatencyHigh
    expr: |
      histogram_quantile(
        0.95,
        sum(rate(rinco_http_request_duration_seconds_bucket[5m])) by (service, le)
      ) > 0.3
    for: 10m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "p95 > 300ms on {{ $labels.service }}"

  - alert: P99LatencyHigh
    expr: |
      histogram_quantile(
        0.99,
        sum(rate(rinco_http_request_duration_seconds_bucket[5m])) by (service, le)
      ) > 1
    for: 5m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "p99 > 1s on {{ $labels.service }}"

  - alert: DBQueryLatencyHigh
    expr: |
      histogram_quantile(0.95, sum(rate(pg_stat_activity_max_tx_duration[5m])) by (datname, le)) > 5
    for: 5m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "DB p95 query > 5s for {{ $labels.datname }}"

# ============================================================
# 3. Database warning signals
# ============================================================
- name: rinco.databases.warning
  interval: 30s
  rules:
  - alert: PostgresConnectionsHigh
    expr: pg_stat_activity_count > 80
    for: 1m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "Postgres connections > 80 on {{ $labels.instance }}"

  - alert: PostgresLongRunningTransactions
    expr: |
      pg_locks_count > 1000
    for: 5m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "Postgres lock count > 1000 on {{ $labels.instance }}"

  - alert: PostgresReplicationLag
    expr: pg_replication_lag_seconds > 30
    for: 2m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "PG replica lag > 30s on {{ $labels.instance }}"

  - alert: ScyllaWriteTimeout
    expr: rate(scylla_write_timeouts_total[5m]) > 0.1
    for: 1m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "Scylla write timeouts on {{ $labels.instance }}"

  - alert: ScyllaHintsOutstanding
    expr: scylla_hints_total > 10000
    for: 5m
    labels:
      severity: P1
      team: sre

  - alert: ValkeyMemoryHigh
    expr: |
      valkey_used_memory_bytes / valkey_max_memory_bytes > 0.9
    for: 1m
    labels:
      severity: P1
      team: sre

  - alert: ValkeyEvictionsHigh
    expr: rate(valkey_evicted_keys_total[5m]) > 100
    for: 5m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "Valkey evicting > 100 keys/s on {{ $labels.instance }}"

  - alert: MongoReplicationLag
    expr: mongodb_ss_repl_secondary_delay_seconds > 30
    for: 2m
    labels:
      severity: P1
      team: sre

# ============================================================
# 4. Resource warning signals
# ============================================================
- name: rinco.resources.warning
  interval: 30s
  rules:
  - alert: DiskSpaceFilling
    expr: |
      (
        node_filesystem_avail_bytes{mountpoint="/"}
        / node_filesystem_size_bytes{mountpoint="/"}
      ) < 0.10
    for: 5m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "Disk < 10% free on {{ $labels.instance }}"

  - alert: HighCPU
    expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
    for: 5m
    labels:
      severity: P1
      team: sre

  - alert: HighMemoryUsage
    expr: |
      (
        1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
      ) * 100 > 90
    for: 2m
    labels:
      severity: P1
      team: sre

  - alert: PodCPUThrottled
    expr: |
      rate(container_cpu_cfs_throttled_seconds_total[5m]) > 0.1
    for: 10m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "CPU throttled on pod {{ $labels.pod }} (>10% of period)"

# ============================================================
# 5. Security warning signals
# ============================================================
- name: rinco.security.warning
  interval: 1m
  rules:
  - alert: BruteForceSuspected
    expr: |
      rate(auth_login_attempts_total{result="failure"}[5m]) > 10
    for: 5m
    labels:
      severity: P1
      team: sre
      security: "true"
    annotations:
      summary: "Brute-force suspected from {{ $labels.ip }} (> 10 fail/s)"

  - alert: RateLimitBlockSpike
    expr: |
      sum(rate(rate_limit_blocked_total[5m])) by (service) > 100
    for: 5m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "> 100 rate-limit blocks/s on {{ $labels.service }}"

  - alert: SuspiciousOriginCountry
    expr: |
      increase(auth_login_anomaly_country_total[1h]) > 5
    for: 0m
    labels:
      severity: P1
      team: sre
      security: "true"
    annotations:
      summary: "5+ logins from unexpected country for {{ $labels.user_id }}"

  - alert: AuditLogDroppedHigh
    expr: |
      increase(audit_records_dropped_total[10m]) > 50
    for: 0m
    labels:
      severity: P1
      team: sre
    annotations:
      summary: "> 50 audit records dropped in 10m (sink degraded)"

# ============================================================
# 6. AI services
# ============================================================
- name: rinco.ai.warning
  interval: 1m
  rules:
  - alert: AISREAnalysisErrorSpike
    expr: |
      sum(rate(ai_sre_analysis_requests_total{result="failed"}[5m]))
      /
      sum(rate(ai_sre_analysis_requests_total[5m])) > 0.2
    for: 3m
    labels:
      severity: P1
      service: ai-sre
    annotations:
      summary: "AI SRE analysis failure rate > 20%"

  - alert: AISREHotfixPRBurst
    expr: |
      sum(increase(ai_sre_hotfix_created_total[1h])) by (tenant_id) > 5
    for: 0m
    labels:
      severity: P1
      service: ai-sre
    annotations:
      summary: "AI SRE created > 5 hotfix PRs in last hour for {{ $labels.tenant_id }}"

  - alert: RAGChatHighFailureRate
    expr: |
      sum(rate(rag_chat_requests_total{result="failed"}[5m]))
      /
      sum(rate(rag_chat_requests_total[5m])) > 0.15
    for: 5m
    labels:
      severity: P1
      service: rag-chatbot
    annotations:
      summary: "RAG chat failure rate > 15%"

  - alert: STTErrorBurst
    expr: |
      sum(rate(transcribe_errors_total[5m])) > 0.5
    for: 5m
    labels:
      severity: P1
      service: stt
    annotations:
      summary: "STT error rate > 0.5/s"

  - alert: LeadScoringModelLoadFailure
    expr: |
      rate(lead_scoring_errors_total{error_type="model_load"}[5m]) > 0
    for: 2m
    labels:
      severity: P1
      service: lead-scoring
    annotations:
      summary: "Lead scoring model-load failures detected"