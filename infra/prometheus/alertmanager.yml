global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'webhook-receiver'

receivers:
- name: 'webhook-receiver'
  webhook_configs:
  - url: 'http://localhost:5001/alerts'
    send_resolved: true

inhibit_rules:
- source_match:
    severity: 'P0'
  target_match:
    severity: 'P1'
  equal: ['alertname', 'cluster', 'service']
