# ============================================================
# Recording rules — precomputed time-series aggregations
# ============================================================
groups:

- name: rinco.api.recording
  interval: 30s
  rules:
  # ----- Aggregated per-service request rate -----
  - record: rinco:http_requests:rate5m
    expr: sum by (service, route, status) (rate(rinco_http_requests_total[5m]))

  # ----- p50 / p95 / p99 latency, persisted to disk -----
  - record: rinco:http_latency:p50
    expr: histogram_quantile(0.50, sum by (service, route, le) (rate(rinco_http_request_duration_seconds_bucket[5m])))

  - record: rinco:http_latency:p95
    expr: histogram_quantile(0.95, sum by (service, route, le) (rate(rinco_http_request_duration_seconds_bucket[5m])))

  - record: rinco:http_latency:p99
    expr: histogram_quantile(0.99, sum by (service, route, le) (rate(rinco_http_request_duration_seconds_bucket[5m])))

  # ----- Error ratio per service -----
  - record: rinco:http_error_ratio:5m
    expr: |
      sum by (service, route) (rate(rinco_http_requests_total{status=~"5.."}[5m]))
      /
      sum by (service, route) (rate(rinco_http_requests_total[5m]))

  # ----- SLO remaining (99% over 30d) -----
  - record: rinco:slo:remaining_budget
    expr: 1 - (rinco:http_error_ratio:5m * 100)

- name: rinco.db.recording
  interval: 30s
  rules:
  - record: rinco:db:connections:used
    expr: pg_stat_activity_count

  - record: rinco:db:transactions:rate5m
    expr: sum by (datname) (rate(pg_stat_database_xact_commit[5m]))

  - record: rinco:chat:messages:rate5m
    expr: sum(rate(rinco_chat_messages_sent_total[5m]))

  - record: rinco:events:per_second
    expr: sum(rate(rinco_nats_published_total[5m]))

- name: rinco.infra.recording
  interval: 30s
  rules:
  - record: rinco:node:cpu:utilization
    expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

  - record: rinco:node:memory:utilization
    expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100

  - record: rinco:node:disk:utilization
    expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100
