extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1888

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
      - job_name: 'otel-collector'
        scrape_interval: 10s
        static_configs:
        - targets: ['0.0.0.0:8888']

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
    - key: deployment.environment
      value: development
      action: upsert
  resourcedetection:
    detectors: [env, system]

exporters:
  prometheus:
    endpoint: 0.0.0.0:8888
    namespace: rinco

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # NOTE: clickhouse exporter is disabled by default in dev because the
  # stock clickhouse image only binds the native protocol (9000) to
  # loopback, and ClickHouse logs use a different default database
  # (`rinco_logs`) that must be provisioned separately.  Re-enable
  # after exporting the native port (compose: "9000:9000" instead of
  # "9005:9000") and creating the `rinco_logs` database.
  # clickhouse:
  #   endpoint: tcp://clickhouse:9000
  #   database: rinco_logs
  #   username: rinco
  #   password: rinco_dev_password
  #   logs_table_name: app_logs
  #   timeout: 5s

  logging:
    verbosity: normal

service:
  extensions: [health_check, pprof]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, resourcedetection, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [logging]
