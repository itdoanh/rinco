# ============================================================
# Valkey 7.x configuration — RINCO tuned
# ============================================================
# Reference: https://valkey.io/topics/config-file
# ============================================================

# ---- Networking ----
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---- Authentication ----
requirepass rinco_dev_password
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command CONFIG  ""

# ---- Snapshot persistence (RDB) ----
# Save the dataset every 60 seconds if at least 1000 keys changed.
save 60 1000

# ---- Append-only file persistence ----
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ---- Memory ----
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# ---- Lazy eviction ----
lazyfree-lazy-eviction yes
lazyfree-lazy-expire   yes
lazyfree-lazy-server-del yes
replica-lazy-flush      yes

# ---- Threading ----
# io-threads must NOT exceed CPU cores. 4 threads = good for 4-8 core VM.
io-threads 4
io-threads-do-reads yes

# ---- Slow log ----
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---- Latency monitoring ----
latency-monitor-threshold 100

# ---- Event notifications (keyspace, for cache invalidation) ----
notify-keyspace-events "Ex"

# ---- Logging ----
loglevel notice
logfile ""

# ---- Cluster (disabled for single-node local-dev) ----
cluster-enabled no

# ---- Client output buffer ----
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ---- Hash slot batch ----
hash-max-listpack-entries 512
hash-max-listpack-value 64
list-max-listpack-size -2
set-max-listpack-entries 128
zset-max-listpack-entries 128

# ---- Misc ----
hz 10
dynamic-hz yes
