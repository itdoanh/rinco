# ============================================================
# NATS JetStream configuration (RINCO)
# ============================================================
# Single-node, in-container dev config. Production uses 3-node
# cluster + separate `accounts/` definitions.
# ============================================================

server_name: "rinco-nats-1"
listen: "0.0.0.0:4222"
http: "0.0.0.0:8222"

# ---- Logging ----
debug: false
trace: false
logtime: true
log_file: "/data/nats.log"

# ---- Auth ----
# (DEV ONLY) — production should use `accounts:` + JWT/credentials.
authorization {
  user: "rinco"
  password: "rinco_dev_password"
  timeout: 5
}

# ---- JetStream ----
jetstream {
  store_dir: "/data/jetstream"
  max_mem:    536870912    # 512 MB
  max_file:   2147483648   # 2 GB
  max_streams: 64
  max_consumers: 1024
  max_msgs_per_subject: 1000000
  max_bytes: 1073741824    # 1 GiB per stream
  pool_size: 3
  encryption_key: ""
}

# ---- Clustering (disabled in dev) ----
cluster {
  name: "rinco-nats-cluster"
  listen: "0.0.0.0:6222"

  routes = [
    # nats://nats-2:6222
    # nats://nats-3:6222
  ]

  cluster_advertise: "nats:6222"
  connect_retries: 60
  connect_backoff: 2
  max_failures: 2
}

# ---- System events ----
systemevent {
  events: "Payload Violations, Disconnect Old, Authentication Violations"
}

# ---- WebSocket ----
websocket {
  listen: "0.0.0.0:9222"
  no_tls: true
}

# ---- TLS (commented for dev) ----
# tls {
#   cert_file:  "/etc/nats/tls/server.crt"
#   key_file:   "/etc/nats/tls/server.key"
#   ca_file:    "/etc/nats/tls/ca.crt"
#   verify:    true
# }

# ---- Limits ----
max_payload: 8MB
max_pending: 64MB
max_connections: 65536
max_control_line: 4096
max_request_line: 8192
max_subscriptions_per_connection: 1000
max_unprocessed_msgs: 10000
