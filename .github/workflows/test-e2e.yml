name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  e2e-all-apps:
    name: E2E All Apps
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Install all apps' dependencies in parallel.
      - name: Install landing deps
        run: cd frontend/landing && npm ci

      - name: Install admin-portal deps
        run: cd frontend/admin-portal && npm ci

      - name: Install tenant-site deps
        run: cd frontend/tenant-site && npm ci

      - name: Install meeting-ui deps
        run: cd frontend/meeting-ui && npm ci

      # Install Playwright once (shared).
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Start all 4 dev servers in background.
      - name: Start dev servers
        run: |
          cd frontend/landing && npm run dev -p 3000 &
          cd frontend/admin-portal && npm run dev -p 3001 &
          cd frontend/tenant-site && npm run dev -p 3002 &
          cd frontend/meeting-ui && npm run dev -p 3003 &
          echo "Waiting for servers to start..."
          for port in 3000 3001 3002 3003; do
            for i in $(seq 1 30); do
              if curl -sf http://localhost:$port > /dev/null 2>&1; then
                echo "Port $port is up"
                break
              fi
              sleep 2
            done
          done

      - name: Wait for servers
        run: sleep 10

      - name: Run E2E tests
        run: |
          cd frontend
          npx playwright test e2e/comprehensive.spec.ts --reporter=list --workers=1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 14
