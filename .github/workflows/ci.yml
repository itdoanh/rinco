name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.26'
  RUST_VERSION: stable
  PYTHON_VERSION: '3.13'

jobs:
  # ─── Go Services ───────────────────────────────────────────────────────────
  lint-go:
    name: Lint Go Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run linters
        run: |
          for svc in services/auth-service services/tenant-service services/crm-service services/dynamic-model-service services/lead-service services/landing-service services/email-service services/notification-service services/observability-service services/billing-service services/search-service; do
            if [ -d "$svc" ] && [ -f "$svc/go.mod" ]; then
              echo "==> Linting $svc"
              (cd $svc && go vet ./... 2>&1) || true
            fi
          done

      - name: golangci-lint (auth-service sample)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/auth-service

  test-go:
    name: Test Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/auth-service
          - services/tenant-service
          - services/crm-service
          - services/dynamic-model-service
          - services/lead-service
          - services/landing-service
          - services/email-service
          - services/notification-service
          - services/observability-service
          - services/billing-service
          - services/search-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles(format('{0}/go.sum', matrix.service)) }}

      - name: Test
        run: |
          echo "==> Testing ${{ matrix.service }}"
          cd ${{ matrix.service }}
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic 2>&1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage.out
          retention-days: 7

  # ─── Rust Services ─────────────────────────────────────────────────────────
  lint-rust:
    name: Lint Rust Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/chat-engine
          - services/webrtc-sfu
          - services/recording-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          version: ${{ env.RUST_VERSION }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.service }} -> target

      - name: Clippy
        run: |
          echo "==> Clippy ${{ matrix.service }}"
          cargo clippy --all-features -- -D warnings 2>&1 || true

  test-rust:
    name: Test Rust Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/chat-engine
          - services/webrtc-sfu
          - services/recording-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          version: ${{ env.RUST_VERSION }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.service }} -> target

      - name: Test
        run: |
          echo "==> Testing ${{ matrix.service }}"
          cd ${{ matrix.service }}
          cargo test --verbose -- --nocapture 2>&1

  # ─── Python Services ────────────────────────────────────────────────────────
  test-python:
    name: Test Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/lead-scoring
          - services/ai-sre
          - services/rag-chatbot
          - services/stt-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles(format('{0}/requirements.txt', matrix.service)) }}

      - name: Install dependencies
        run: |
          echo "==> Installing ${{ matrix.service }}"
          cd ${{ matrix.service }}
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . 2>&1 || true; fi
          pip install pytest pytest-asyncio pytest-cov httpx 2>&1 || true

      - name: Test
        run: |
          echo "==> Testing ${{ matrix.service }}"
          cd ${{ matrix.service }}
          pytest tests/ -v --tb=short 2>&1

  lint-python:
    name: Lint Python Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff 2>&1

      - name: Run ruff
        run: |
          for svc in services/lead-scoring services/ai-sre services/rag-chatbot services/stt-service; do
            if [ -d "$svc" ]; then
              echo "==> Linting $svc"
              ruff check $svc 2>&1 || true
            fi
          done

  # ─── Docker Build ─────────────────────────────────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-go, test-go, lint-rust, test-rust, test-python, lint-python]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services
        run: |
          docker compose -f infra/docker-compose.services.yml build 2>&1 || true

  # ─── Frontend ─────────────────────────────────────────────────────────────
  test-frontend:
    name: Test Frontend Apps
    runs-on: ubuntu-latest
    strategy:
      matrix:
          app:
          - frontend/admin-portal
          - frontend/tenant-site
          - frontend/meeting-ui
          - frontend/landing
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -d "${{ matrix.app }}" ]; then
            cd ${{ matrix.app }}
            if [ -f package-lock.json ]; then npm ci 2>&1; fi
            if [ ! -f package-lock.json ] && [ -f package.json ]; then npm install 2>&1; fi
          fi

      - name: Type check
        run: |
          if [ -d "${{ matrix.app }}" ]; then
            cd ${{ matrix.app }}
            npx --no-install tsc --noEmit 2>&1 || true
          fi

  # ─── Deploy Staging ────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    needs: build-images
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "Deploying to staging environment..."
          # kubectl apply -f infra/k8s/staging/ 2>&1
