// WS-K: k6 WebSocket load test for chat-engine
//   50 concurrent WebSocket connections
//   ~10 msg/sec total
//   Measure reconnect time under load
// Usage:
//   k6 run --env WS_URL=ws://localhost:8090/ws \
//          --env TOKEN=<jwt> \
//          scripts/wsk-k6-websocket.yml
import ws from 'k6/ws';
import { check } from 'k6';

export const options = {
  stages: [
    { duration: '20s', target: 25 },
    { duration: '60s', target: 50 },
    { duration: '20s', target: 0 },
  ],
  thresholds: {
    'ws_connecting':  ['p(95)<500'],
    'ws_session_duration': ['p(95)<60000'],
  },
};

const WS_URL = __ENV.WS_URL || 'ws://localhost:8090/ws';
const TOKEN  = __ENV.TOKEN  || '';

export default function () {
  const url = TOKEN ? `${WS_URL}?token=${TOKEN}` : WS_URL;
  const start = Date.now();
  const res = ws.connect(url, null, socket => {
    socket.on('open', () => {
      // handshake ok
    });
    socket.on('message', () => {});
    socket.setInterval(() => {
      socket.send(JSON.stringify({ type: 'ping', t: Date.now() }));
    }, 1000);
    socket.setTimeout(() => socket.close(), 30000);
  });
  check(res, { 'ws status 101': r => r && r.status === 101 });
}
