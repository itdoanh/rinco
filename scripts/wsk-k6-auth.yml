// WS-K: k6 load test for auth-service POST /v1/auth/login
// Targets:
//   p95 < 200ms, error rate < 1% (Thresholds below)
// Stages:
//   30s warmup at 10 VUs -> 60s steady at 100 VUs -> 30s rampdown to 0
// Usage:
//   k6 run --env BASE_URL=http://localhost:8081 \
//          --env TENANT_ID=<uuid> \
//          --env EMAIL=user@example.com \
//          --env PASSWORD=secret \
//          scripts/wsk-k6-auth.yml
import http from 'k6/http';
import { check, sleep } from 'k6';

export const options = {
  stages: [
    { duration: '30s', target: 10 },
    { duration: '60s', target: 100 },
    { duration: '30s', target: 0 },
  ],
  thresholds: {
    http_req_duration: ['p(95)<200'],
    http_req_failed:   ['rate<0.01'],
  },
  noConnectionReuse: false,
};

const BASE_URL   = __ENV.BASE_URL   || 'http://localhost:8081';
const TENANT_ID  = __ENV.TENANT_ID  || '00000000-0000-0000-0000-000000000001';
const EMAIL      = __ENV.EMAIL      || 'wsk-test@rinco.app';
const PASSWORD   = __ENV.PASSWORD   || 'rinco_dev_password';

export default function () {
  const body = JSON.stringify({
    tenant_id: TENANT_ID,
    email:     EMAIL,
    password:  PASSWORD,
  });
  const res = http.post(`${BASE_URL}/v1/auth/login`, body, {
    headers: { 'Content-Type': 'application/json' },
  });
  check(res, {
    'status is 200': r => r.status === 200,
    'has access_token': r => {
      try { return !!r.json('access_token'); } catch (e) { return false; }
    },
  });
  sleep(1);
}
