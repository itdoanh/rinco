// WS-K: k6 load test for lead-service POST /v1/leads
//   p95 < 400ms, error rate < 5% (lead ingest can be slower)
//   100 VUs steady 60s
// Usage:
//   k6 run --env BASE_URL=http://localhost:8085 \
//          --env TENANT_ID=<uuid> \
//          scripts/wsk-k6-lead-ingest.yml
import http from 'k6/http';
import { check, sleep } from 'k6';

export const options = {
  stages: [
    { duration: '20s', target: 50 },
    { duration: '60s', target: 100 },
    { duration: '20s', target: 0 },
  ],
  thresholds: {
    http_req_duration: ['p(95)<400'],
    http_req_failed:   ['rate<0.05'],
  },
};

const BASE_URL  = __ENV.BASE_URL  || 'http://localhost:8085';
const TENANT_ID = __ENV.TENANT_ID || '00000000-0000-0000-0000-000000000001';

const FIRST = ['John', 'Jane', 'Alex', 'Sara', 'Minh', 'Lan', 'Huy', 'Trang'];
const LAST  = ['Doe', 'Smith', 'Nguyen', 'Tran', 'Le', 'Pham'];

export default function () {
  const fn = FIRST[Math.floor(Math.random() * FIRST.length)];
  const ln = LAST[Math.floor(Math.random() * LAST.length)];
  const body = JSON.stringify({
    tenant_id: TENANT_ID,
    name:      `${fn} ${ln}`,
    email:     `${fn.toLowerCase()}.${ln.toLowerCase()}${__VU}@example.com`,
    phone:     `+84${Math.floor(100000000 + Math.random() * 899999999)}`,
    source:    'wsk-loadtest',
    message:   'WS-K nightly loadtest lead',
  });
  const res = http.post(`${BASE_URL}/v1/leads`, body, {
    headers: { 'Content-Type': 'application/json' },
  });
  check(res, {
    'status 200 or 201': r => r.status === 200 || r.status === 201,
  });
  sleep(0.5);
}
