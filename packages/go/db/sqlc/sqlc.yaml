# sqlc.yaml - cấu hình cho sqlc (https://sqlc.dev)
# 
# Generate Go code từ queries.sql + schema.sql:
#   sqlc generate
#
# Output sẽ vào package "sqlc" trong cùng folder.

version: "2"
sql:
  - engine: "postgresql"
    queries: "queries.sql"
    schema: "schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "."
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: false
        emit_pointers_for_null_types: true
        overrides:
          - column: "auth.users.id"
            go_type: "github.com/google/uuid.UUID"
          - column: "auth.users.tenant_id"
            go_type: "github.com/google/uuid.UUID"